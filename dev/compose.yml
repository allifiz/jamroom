# Optional development-only stack. Hosted Supabase is the production target.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
    command:
      [
        postgres,
        -c,
        wal_level=logical,
        -c,
        max_replication_slots=20,
        -c,
        max_wal_senders=20,
      ]
    volumes:
      - data:/var/lib/postgresql/data
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      retries: 30
  auth:
    image: supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${DEV_DB_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3000/**
      GOTRUE_JWT_SECRET: ${DEV_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: 100
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_SMTP_ADMIN_EMAIL: dev@localhost
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: JAMROOM local
  rest:
    image: postgrest/postgrest:v14.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${DEV_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${DEV_JWT_SECRET}
  realtime:
    networks:
      default:
        aliases: [realtime-dev.supabase-realtime]
    image: supabase/realtime:v2.73.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DEV_DB_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${DEV_JWT_SECRET}
      SECRET_KEY_BASE: ${DEV_SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${DEV_JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: 10000
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
  gateway:
    image: kong:2.8.1
    depends_on: [auth, rest, realtime]
    ports: ["127.0.0.1:54321:8000"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_LOG_LEVEL: error
    volumes: ["./kong.yml:/etc/kong/kong.yml:ro"]
volumes:
  data:
